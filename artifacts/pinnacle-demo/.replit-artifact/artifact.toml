kind = "web"
previewPath = "/"
title = "Pinnacle Academic Classes — Demo Website"
version = "1.0.0"
id = "artifacts/pinnacle-demo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24694

[services.development]
run = "pnpm --filter @workspace/pinnacle-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pinnacle-demo", "run", "build" ]
publicDir = "artifacts/pinnacle-demo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24694"
BASE_PATH = "/"
