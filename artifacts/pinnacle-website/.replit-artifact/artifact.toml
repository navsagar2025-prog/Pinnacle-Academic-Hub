kind = "web"
previewPath = "/"
title = "Pinnacle Academic Classes"
version = "1.0.0"
id = "artifacts/pinnacle-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19577

[services.development]
run = "pnpm --filter @workspace/pinnacle-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pinnacle-website", "run", "build" ]
publicDir = "artifacts/pinnacle-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19577"
BASE_PATH = "/"
