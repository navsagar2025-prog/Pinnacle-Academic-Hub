version: "3.9"

# Full stack: builds from source.
# For pre-built (no source required) use docker-compose.prebuilt.yml

services:
  api:
    build:
      context: .
      target: api
    container_name: pinnacle-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      NODE_ENV: production
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - pinnacle

  web:
    build:
      context: .
      target: web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        BASE_PATH: "/"
    container_name: pinnacle-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pinnacle

  # Optional: local Postgres (comment out if using Supabase or external DB)
  # db:
  #   image: postgres:15-alpine
  #   container_name: pinnacle-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: pinnacle
  #     POSTGRES_PASSWORD: changeme
  #     POSTGRES_DB: pinnacle
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - pinnacle

volumes:
  uploads:
  # pgdata:

networks:
  pinnacle:
    driver: bridge
