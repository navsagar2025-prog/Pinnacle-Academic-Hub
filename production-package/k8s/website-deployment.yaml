apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: pinnacle
  labels:
    app: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: website
          image: ghcr.io/your-org/pinnacle-web:latest   # replace with your image
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: pinnacle
spec:
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 80
