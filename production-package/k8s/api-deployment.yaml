apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: pinnacle
  labels:
    app: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: ghcr.io/your-org/pinnacle-api:latest   # replace with your image
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pinnacle-config
            - secretRef:
                name: pinnacle-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: pinnacle
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080
